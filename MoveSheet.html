function Convert(filename,b){
  let s="",v="           ",u,c=-1,z=false;

    z=!z;if(z){c++}

    else {u="        |"+t[i]+"\n"}                   //Lyrics
    s+=u;
  }
  SaveTxt(s,"text",filename+".txt");
}


function SaveTxt(text, fileType, fileName) {
  var blob = new Blob([text], { type: fileType });
  var a = document.createElement('a');
  a.download = fileName;
  a.href = URL.createObjectURL(blob);
  a.dataset.downloadurl = [fileType, a.download, a.href].join(':');
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(a.href); }, 1500);
}

}

function smooth_scroll_to(element, target, duration) {      // based on http://en.wikipedia.org/wiki/Smoothstep
  target = Math.round(target);
  duration = Math.round(duration);
  if (duration < 0) {return Promise.reject("bad duration");}
  if (duration === 0) {element.scrollTop = target;return Promise.resolve();}
  var start_time = Date.now();
  var end_time = start_time + duration;
  var start_top = element.scrollTop;
  var distance = target - start_top;
  var smooth_step = function(start, end, point) {
    if(point <= start) { return 0; }
    if(point >= end) { return 1; }
    var x = (point - start) / (end - start); // interpolation
    return x*x*(3 - 2*x);
  }
  return new Promise(function(resolve, reject) {
    // This is to keep track of where the element's scrollTop is
    // supposed to be, based on what we're doing
    var previous_top = element.scrollTop;
    // This is like a think function from a game loop
    var scroll_frame = function() {
      if(element.scrollTop != previous_top) {
          reject("interrupted");
          return;
      }

      // set the scrollTop for this frame
      var now = Date.now();
      var point = smooth_step(start_time, end_time, now);
      var frameTop = Math.round(start_top + (distance * point));
      element.scrollTop = frameTop;
      // check if we're done!
      if(now >= end_time) {resolve();return;}
      // If we were supposed to scroll but didn't, then we
      // probably hit the limit, so consider it done; not
      // interrupted.
      if(element.scrollTop === previous_top
        && element.scrollTop !== frameTop) {
        resolve();
        return;
      }
      previous_top = element.scrollTop;
      // schedule next frame for execution
      setTimeout(scroll_frame, 0);
    }
    setTimeout(scroll_frame, 0);
  });
}

Decode=()=>{
  let b=true; // 
  let y,t=0;
  Atm=[[],[]];
  AiDt=ctx1.getImageData(0,0,300,1).data;
  ctx1.font="20px arial";
  for(let i=0;i<200;i++){
    y=AiDt[i*4]*256+AiDt[i*4+1];               // 2 bytes
    document.getElementById("rd"+i).value=y;
    t=AiDt[i*4+2];                             // 1 byte

      if(b){ctx1.fillText(i,20,y)}   // draw number row (evita ripetizioni indietro)          
      Atm[0].push(t);           //time
      Atm[1].push(y);maxY=y}}   // Y 
  stepY=parseInt(Atm[1][5]/5)
  GetTime();
}


Encode=()=>{           
  let y,t;
  let imd=ctx1.createImageData(1,1);
  ctx1.fillStyle = "black";
  for(let i=0;i<200;i++){                           // salta prologo
    y=document.getElementById("rd"+i).value;
    t=document.getElementById("re"+i).value;
    y=dechex(y);
    imd.data[0]=y[0];                  //Yrow low
    imd.data[1]=y[1];                  //Yrow hight
    imd.data[2]=t;                     //time ...< 256 1 byte
    imd.data[3]=255;                   //alpha ... always 255
    ctx1.putImageData(imd,i,0);
  }
  ctx1.clearRect(18,18,30,cnv1.height); // remove rows number
  DownloadImage();
}

function dechex(i) {
let h,d=[];  
let s="0000"; 
h=(Number(i).toString(16));
h=s.substring(0,4-h.length)+h;
d[0]=Number("0x"+h.substring(0,2));
d[1]=Number("0x"+h.substring(2,4));
return d;
}

}
